[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mssm-mls-logomega"
version = "0.1.1"
description = "Independent historical MSSM MLS reconstruction; raw inputs and log-omega-only labels"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = ["numpy>=1.24,<3", "torch>=2.2,<3", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
mssm-mls-logomega = "mssm_mls.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
